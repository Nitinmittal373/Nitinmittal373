<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" fill="none">
  <defs>
    <filter id="glow-i">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0d1a0d" stroke-width="0.3"/>
    </pattern>
  </defs>

  <rect width="840" height="320" fill="#0a0e0a" rx="6"/>
  <rect width="840" height="320" fill="url(#grid3)" rx="6" opacity="0.3"/>

  <!-- Title -->
  <text x="420" y="30" font-family="'Courier New',monospace" font-size="12" fill="#00d4ff" text-anchor="middle" filter="url(#glow-i)">/system/areas-of-interest</text>
  <line x1="150" y1="40" x2="690" y2="40" stroke="#0d2d2d" stroke-width="0.5"/>

  <!-- ═══════ CONNECTION LINES (drawn first, behind nodes) ═══════ -->
  <!-- Central hub connections -->
  <!-- API Design → HTTP (horizontal) -->
  <line x1="190" y1="100" x2="350" y2="100" stroke="#0d2d0d" stroke-width="0.8" stroke-dasharray="3,4">
    <animate attributeName="stroke" values="#0d2d0d;#1a4a1a;#0d2d0d" dur="4s" repeatCount="indefinite"/>
  </line>
  <!-- HTTP → Auth -->
  <line x1="490" y1="100" x2="650" y2="100" stroke="#0d2d0d" stroke-width="0.8" stroke-dasharray="3,4">
    <animate attributeName="stroke" values="#0d2d0d;#1a4a1a;#0d2d0d" dur="4s" repeatCount="indefinite" begin="0.5s"/>
  </line>
  <!-- DB → Transactions (vertical) -->
  <line x1="135" y1="185" x2="135" y2="245" stroke="#0d2d2d" stroke-width="0.8" stroke-dasharray="3,4">
    <animate attributeName="stroke" values="#0d2d2d;#1a4a4a;#0d2d2d" dur="4s" repeatCount="indefinite" begin="1s"/>
  </line>
  <!-- Concurrency → Error Handling -->
  <line x1="420" y1="185" x2="420" y2="245" stroke="#0d2d2d" stroke-width="0.8" stroke-dasharray="3,4">
    <animate attributeName="stroke" values="#0d2d2d;#1a4a4a;#0d2d2d" dur="4s" repeatCount="indefinite" begin="1.5s"/>
  </line>
  <!-- System Design → Error Handling -->
  <line x1="645" y1="185" x2="560" y2="258" stroke="#0d2d2d" stroke-width="0.8" stroke-dasharray="3,4">
    <animate attributeName="stroke" values="#0d2d2d;#1a4a4a;#0d2d2d" dur="4s" repeatCount="indefinite" begin="2s"/>
  </line>
  <!-- Cross connections -->
  <line x1="190" y1="170" x2="310" y2="170" stroke="#0d1a0d" stroke-width="0.5" stroke-dasharray="2,5"/>
  <line x1="490" y1="170" x2="560" y2="170" stroke="#0d1a0d" stroke-width="0.5" stroke-dasharray="2,5"/>
  <line x1="270" y1="258" x2="330" y2="258" stroke="#0d1a0d" stroke-width="0.5" stroke-dasharray="2,5"/>

  <!-- ═══════ ROW 1: Top tier ═══════ -->

  <!-- Node: API Design -->
  <rect x="40" y="70" width="150" height="55" rx="4" fill="#0d120d" stroke="#00ff88" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="52" cy="80" r="3" fill="#00ff88" opacity="0.8"/>
  <text x="60" y="80" font-family="'Courier New',monospace" font-size="8" fill="#335533"> ACTIVE</text>
  <text x="115" y="97" font-family="'Courier New',monospace" font-size="11" fill="#00ff88" text-anchor="middle" font-weight="bold">API Design</text>
  <text x="115" y="113" font-family="'Courier New',monospace" font-size="8" fill="#557755" text-anchor="middle">REST · endpoints · contracts</text>

  <!-- Node: HTTP Fundamentals -->
  <rect x="255" y="70" width="165" height="55" rx="4" fill="#0d120d" stroke="#00d4ff" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" begin="0.4s"/>
  </rect>
  <circle cx="267" cy="80" r="3" fill="#00d4ff" opacity="0.8"/>
  <text x="275" y="80" font-family="'Courier New',monospace" font-size="8" fill="#335555"> LEARNING</text>
  <text x="337" y="97" font-family="'Courier New',monospace" font-size="11" fill="#00d4ff" text-anchor="middle" font-weight="bold">HTTP Fundamentals</text>
  <text x="337" y="113" font-family="'Courier New',monospace" font-size="8" fill="#557777" text-anchor="middle">status codes · headers · methods</text>

  <!-- Node: Auth -->
  <rect x="490" y="70" width="160" height="55" rx="4" fill="#0d120d" stroke="#00d4ff" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" begin="0.8s"/>
  </rect>
  <circle cx="502" cy="80" r="3" fill="#00d4ff" opacity="0.8"/>
  <text x="510" y="80" font-family="'Courier New',monospace" font-size="8" fill="#335555"> LEARNING</text>
  <text x="570" y="97" font-family="'Courier New',monospace" font-size="11" fill="#00d4ff" text-anchor="middle" font-weight="bold">Auth &amp; Security</text>
  <text x="570" y="113" font-family="'Courier New',monospace" font-size="8" fill="#557777" text-anchor="middle">tokens · sessions · access control</text>

  <!-- ═══════ ROW 2: Middle tier ═══════ -->

  <!-- Node: Database Design -->
  <rect x="55" y="150" width="160" height="55" rx="4" fill="#0d120d" stroke="#ffaa00" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" begin="1.2s"/>
  </rect>
  <circle cx="67" cy="160" r="3" fill="#00ff88" opacity="0.8"/>
  <text x="75" y="160" font-family="'Courier New',monospace" font-size="8" fill="#335533"> ACTIVE</text>
  <text x="135" y="177" font-family="'Courier New',monospace" font-size="11" fill="#ffaa00" text-anchor="middle" font-weight="bold">Database &amp; SQL</text>
  <text x="135" y="193" font-family="'Courier New',monospace" font-size="8" fill="#776644" text-anchor="middle">Room · queries · schema design</text>

  <!-- Node: Concurrency -->
  <rect x="310" y="150" width="170" height="55" rx="4" fill="#0d120d" stroke="#00d4ff" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" begin="1.6s"/>
  </rect>
  <circle cx="322" cy="160" r="3" fill="#ffaa00" opacity="0.8"/>
  <text x="330" y="160" font-family="'Courier New',monospace" font-size="8" fill="#555533"> EXPLORING</text>
  <text x="395" y="177" font-family="'Courier New',monospace" font-size="11" fill="#00d4ff" text-anchor="middle" font-weight="bold">Concurrency</text>
  <text x="395" y="193" font-family="'Courier New',monospace" font-size="8" fill="#557777" text-anchor="middle">threads · race conditions · sync</text>

  <!-- Node: System Design -->
  <rect x="560" y="150" width="170" height="55" rx="4" fill="#0d120d" stroke="#00d4ff" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" begin="2s"/>
  </rect>
  <circle cx="572" cy="160" r="3" fill="#ffaa00" opacity="0.8"/>
  <text x="580" y="160" font-family="'Courier New',monospace" font-size="8" fill="#555533"> EXPLORING</text>
  <text x="645" y="177" font-family="'Courier New',monospace" font-size="11" fill="#00d4ff" text-anchor="middle" font-weight="bold">System Design</text>
  <text x="645" y="193" font-family="'Courier New',monospace" font-size="8" fill="#557777" text-anchor="middle">reliability · scalability · patterns</text>

  <!-- ═══════ ROW 3: Bottom tier ═══════ -->

  <!-- Node: Transactions -->
  <rect x="40" y="235" width="160" height="55" rx="4" fill="#0d120d" stroke="#ffaa00" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" begin="2.4s"/>
  </rect>
  <circle cx="52" cy="245" r="3" fill="#00d4ff" opacity="0.8"/>
  <text x="60" y="245" font-family="'Courier New',monospace" font-size="8" fill="#335555"> LEARNING</text>
  <text x="120" y="262" font-family="'Courier New',monospace" font-size="11" fill="#ffaa00" text-anchor="middle" font-weight="bold">Transactions</text>
  <text x="120" y="278" font-family="'Courier New',monospace" font-size="8" fill="#776644" text-anchor="middle">ACID · consistency · rollback</text>

  <!-- Node: Error Handling -->
  <rect x="330" y="235" width="175" height="55" rx="4" fill="#0d120d" stroke="#00ff88" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" begin="2.8s"/>
  </rect>
  <circle cx="342" cy="245" r="3" fill="#00ff88" opacity="0.8"/>
  <text x="350" y="245" font-family="'Courier New',monospace" font-size="8" fill="#335533"> ACTIVE</text>
  <text x="417" y="262" font-family="'Courier New',monospace" font-size="11" fill="#00ff88" text-anchor="middle" font-weight="bold">Error Handling</text>
  <text x="417" y="278" font-family="'Courier New',monospace" font-size="8" fill="#557755" text-anchor="middle">debugging · edge cases · logging</text>

  <!-- Legend -->
  <circle cx="645" cy="250" r="3" fill="#00ff88"/>
  <text x="655" y="254" font-family="'Courier New',monospace" font-size="8" fill="#557755">ACTIVE — currently using</text>
  <circle cx="645" cy="268" r="3" fill="#00d4ff"/>
  <text x="655" y="272" font-family="'Courier New',monospace" font-size="8" fill="#557777">LEARNING — studying now</text>
  <circle cx="645" cy="286" r="3" fill="#ffaa00"/>
  <text x="655" y="290" font-family="'Courier New',monospace" font-size="8" fill="#776644">EXPLORING — want to explore</text>

  <!-- Bottom line -->
  <line x1="40" y1="305" x2="800" y2="305" stroke="#0d1a0d" stroke-width="0.5"/>
  <text x="420" y="316" font-family="'Courier New',monospace" font-size="8" fill="#1a2a1a" text-anchor="middle">7 nodes │ 3 tiers │ interconnected</text>
</svg>

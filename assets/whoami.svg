<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" fill="none">
  <defs>
    <filter id="glow-t">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Terminal window -->
  <rect width="520" height="230" fill="#0a0e0a" rx="8" stroke="#1a2e1a" stroke-width="1"/>
  <!-- Title bar -->
  <rect width="520" height="28" fill="#0d140d" rx="8"/>
  <rect y="20" width="520" height="8" fill="#0d140d"/>
  <circle cx="18" cy="14" r="5" fill="#ff5f56"/>
  <circle cx="34" cy="14" r="5" fill="#ffbd2e"/>
  <circle cx="50" cy="14" r="5" fill="#27c93f"/>
  <text x="260" y="18" font-family="'Courier New',monospace" font-size="10" fill="#3a5a3a" text-anchor="middle">nitin@backend ~ $</text>

  <!-- Command -->
  <text x="20" y="52" font-family="'Courier New',monospace" font-size="12" fill="#00ff88" filter="url(#glow-t)">
    $ whoami --verbose
    <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze"/>
  </text>

  <text x="20" y="80" font-family="'Courier New',monospace" font-size="11" fill="#557755">
    &gt; curiosity:            high
    <animate attributeName="opacity" values="0;0;1" dur="1.5s" fill="freeze"/>
  </text>
  <text x="20" y="100" font-family="'Courier New',monospace" font-size="11" fill="#557755">
    &gt; debugging:            ongoing
    <animate attributeName="opacity" values="0;0;0;1" dur="2s" fill="freeze"/>
  </text>
  <text x="20" y="120" font-family="'Courier New',monospace" font-size="11" fill="#557755">
    &gt; edge_cases:           worth investigating
    <animate attributeName="opacity" values="0;0;0;0;1" dur="2.5s" fill="freeze"/>
  </text>
  <text x="20" y="140" font-family="'Courier New',monospace" font-size="11" fill="#557755">
    &gt; architecture:         learning by building
    <animate attributeName="opacity" values="0;0;0;0;0;1" dur="3s" fill="freeze"/>
  </text>
  <text x="20" y="160" font-family="'Courier New',monospace" font-size="11" fill="#557755">
    &gt; next_goal:            build something reliable
    <animate attributeName="opacity" values="0;0;0;0;0;0;1" dur="3.5s" fill="freeze"/>
  </text>
  <text x="20" y="180" font-family="'Courier New',monospace" font-size="11" fill="#557755">
    &gt; approach:             solve → build → repeat
    <animate attributeName="opacity" values="0;0;0;0;0;0;0;1" dur="4s" fill="freeze"/>
  </text>

  <!-- Blinking cursor -->
  <rect x="20" y="195" width="7" height="14" fill="#00ff88">
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>

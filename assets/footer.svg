<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 80" fill="none">
  <defs>
    <filter id="glow-f">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="840" height="80" fill="#0a0e0a" rx="4"/>

  <!-- Separator line -->
  <line x1="40" y1="15" x2="800" y2="15" stroke="#0d1a0d" stroke-width="0.5"/>

  <!-- Shutdown message -->
  <text x="420" y="40" font-family="'Courier New',monospace" font-size="11" fill="#1a3a1a" text-anchor="middle">
    $ system.shutdown(graceful=true)
  </text>
  <text x="420" y="55" font-family="'Courier New',monospace" font-size="10" fill="#0d2d0d" text-anchor="middle">
    [OK] All services stopped. Waiting for the next request...
  </text>

  <!-- Blinking cursor -->
  <rect x="413" y="62" width="5" height="10" fill="#00ff88" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- System ID -->
  <text x="20" y="75" font-family="'Courier New',monospace" font-size="7" fill="#0d1a0d">NODE_01</text>
  <text x="820" y="75" font-family="'Courier New',monospace" font-size="7" fill="#0d1a0d" text-anchor="end">v3.7.3</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" width="800" height="190" role="img" aria-label="Learning path: Java, DSA, Android, Backend" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="190" rx="16" fill="url(#bg)"/>
  <text x="24" y="32" fill="#64748b" font-family="'Fira Code', Consolas, Menlo, monospace" font-size="13">$ ./learning --path</text>

  <!-- base line -->
  <line x1="110" y1="95" x2="690" y2="95" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <!-- animated flowing line -->
  <line x1="110" y1="95" x2="690" y2="95" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 12">
    <animate attributeName="stroke-dashoffset" from="44" to="0" dur="1.6s" repeatCount="indefinite"/>
  </line>

  <!-- nodes -->
  <g font-family="'Fira Code', Consolas, Menlo, monospace" text-anchor="middle">
    <g>
      <circle cx="110" cy="95" r="16" fill="#0f172a" stroke="#00d4ff" stroke-width="3"/>
      <circle cx="110" cy="95" r="16" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.6">
        <animate attributeName="r" values="16;28;16" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="110" y="140" fill="#e2e8f0" font-size="16" font-weight="bold">Java</text>
      <text x="110" y="160" fill="#64748b" font-size="11">strengthening</text>
    </g>
    <g>
      <circle cx="303" cy="95" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="303" cy="95" r="16" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6">
        <animate attributeName="r" values="16;28;16" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <text x="303" y="140" fill="#e2e8f0" font-size="16" font-weight="bold">DSA</text>
      <text x="303" y="160" fill="#64748b" font-size="11">practicing daily</text>
    </g>
    <g>
      <circle cx="497" cy="95" r="16" fill="#0f172a" stroke="#818cf8" stroke-width="3"/>
      <circle cx="497" cy="95" r="16" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.6">
        <animate attributeName="r" values="16;28;16" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="497" y="140" fill="#e2e8f0" font-size="16" font-weight="bold">Android</text>
      <text x="497" y="160" fill="#64748b" font-size="11">building apps</text>
    </g>
    <g>
      <circle cx="690" cy="95" r="16" fill="#0f172a" stroke="#a855f7" stroke-width="3"/>
      <circle cx="690" cy="95" r="16" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.6">
        <animate attributeName="r" values="16;28;16" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="690" y="140" fill="#e2e8f0" font-size="16" font-weight="bold">Backend</text>
      <text x="690" y="160" fill="#64748b" font-size="11">Spring Boot</text>
    </g>
  </g>

  <!-- traveling dot -->
  <circle r="6" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M110,95 L690,95"/>
  </circle>
</svg>
